name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: structure, depth, duplicates
        run: python3 bin/audit.py --root .
      - name: natives match the allowlist
        run: python3 bin/check_natives.py --root .
      - name: sources reachable
        run: python3 bin/audit.py --root . --net
      - name: catalog is current
        run: python3 bin/catalog.py --check
      - name: eval cases are valid
        run: python3 bin/eval.py lint
      - name: routing descriptions do not collide
        run: python3 bin/route_audit.py --fail-on-dupes
      - name: version claims match the registries
        run: python3 bin/check_claims.py
      - name: install script is runnable
        run: bash bin/install.sh --dry-run
